# Déposé sous le nom .htaccess à la racine de l’administration, sur OVH.
# Rétablit les en-têtes que netlify.toml assurait auparavant.
#
# Ne jamais y ajouter « Options -ExecCGI » : PHP cesserait de s’exécuter et le relais
# d’authentification renverrait son propre code source.

Options -Indexes

# Sans cette ligne, OVH ne sert pas index.html à la racine du sous-domaine et
# renvoie 403, puisque le listing est désactivé juste au-dessus.
DirectoryIndex index.html

Header set X-Frame-Options "DENY"
Header set X-Content-Type-Options "nosniff"
Header set Referrer-Policy "no-referrer"
Header set Permissions-Policy "camera=(), geolocation=(), microphone=()"
Header set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://api.github.com; frame-src 'self' blob:; worker-src 'self' blob:; font-src 'self' data:; base-uri 'self'; form-action 'self' https://github.com"

# L’administration n’a rien à faire dans un index de moteur de recherche.
Header set X-Robots-Tag "noindex, nofollow"
