locale: fr
# Les liens « voir le site » mènent au site en ligne chez Free, à son adresse HTTPS.
site_url: https://chantdorties.pages-perso.free.fr
display_url: https://chantdorties.pages-perso.free.fr
logo_url: logo.webp

backend:
  name: github
  repo: chantdorties/site
  branch: main
  # Relais d’authentification maison, sur le même domaine que cette administration —
  # voir docs/RELAIS-AUTH.md. « site_domain » n’a plus lieu d’être : il ne servait qu’au
  # relais Netlify, que ce dernier retire progressivement.
  base_url: https://orties-admin.varascundo.com
  auth_endpoint: auth.php
  squash_merges: true
  use_graphql: true

publish_mode: editorial_workflow
local_backend:
  url: http://127.0.0.1:8082/api/v1
media_folder: nouveau-site/content/media/uploads
public_folder: content/media/uploads
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: reglages
    label: Réglages du site
    description: >-
      Les textes qui ne dépendent d’aucun contenu : identité, menu, pied de page, textes
      de l’accueil, introductions des pages engendrées, mots du parcours d’achat, ainsi
      que les couleurs et polices du site.
    format: json
    delete: false
    # Chaque réglage a son aperçu (preview.js) : une maquette de la zone du site où
    # ses textes apparaissent. Decap retrouve l’aperçu par le nom de l’entrée : ces
    # noms ne doivent pas coïncider avec ceux d’autres rubriques (voir « introductions »).
    files:
      - name: site
        label: Identité et contact
        file: nouveau-site/content/reglages/site.json
        fields:
          - label: "L’identité de la maison"
            name: groupeIdentite
            widget: groupe
            required: false
            hint: "Le nom, le contact et la présentation repris partout sur le site."
          - {label: "Nom complet", name: nom, widget: string, hint: "Repris dans le pied de page, le titre des onglets et le titre de l’accueil pour les moteurs de recherche."}
          - {label: "Nom court", name: nomCourt, widget: string, hint: "Le nom affiché dans l’en-tête, à côté du logo. Son dernier mot s’affiche en couleur."}
          - label: Description générale
            name: description
            widget: markdown
            hint: La description de l’accueil pour les moteurs de recherche, quand l’accueil n’a pas la sienne.
            modes: [rich_text]
            minimal: true
            # Deux barres d’outils, et une règle : un texte court (accroche, introduction,
            # présentation, biographie, résumé) prend *boutons_courts, sans intertitres ;
            # un texte long découpé en parties (section d’une page, article) prend
            # *boutons_corps, défini plus bas avec le contenu des actualités.
            buttons: &boutons_courts [bold, italic, link, bulleted-list, numbered-list, quote]
            editor_components: []
          - {label: "Adresse courriel", name: courriel, widget: string, hint: "L’adresse de contact affichée dans le pied de page et utilisée par les boutons « Nous contacter »."}
          - {label: "Page Facebook", name: facebook, widget: string, pattern: ['^https?://', "L’adresse doit commencer par http:// ou https://"]}
          - label: "Réglages techniques"
            name: groupeTechnique
            widget: groupe
            required: false
            hint: "À ne modifier qu’en cas de changement d’hébergement."
          - {label: "Domaine public", name: domaine, widget: string, hint: "L’adresse du site en ligne. Réglage technique : ne le changer qu’en cas de changement d’hébergement.", pattern: ['^https?://', "L’adresse doit commencer par http:// ou https://"]}
      - name: navigation
        label: Menu principal
        file: nouveau-site/content/reglages/navigation.json
        fields:
          # L’ordre du menu est celui de la liste : on le change par glisser-déposer.
          # L’identifiant reste dans le fichier (il surligne l’onglet de la page en
          # cours) mais n’est pas montré ; un nouveau lien le reçoit de son adresse.
          - label: Liens
            label_singular: lien
            name: liens
            widget: list
            min: 1
            collapsed: true
            summary: "{{fields.libelle}} — {{fields.url}}"
            hint: Glisser un lien par sa poignée pour changer sa place dans le menu. Décocher « Visible » le retire du menu sans l’effacer.
            fields:
              - {label: "Identifiant technique", name: id, widget: hidden}
              # Le libellé et l’adresse d’un lien, partagés par la recherche et le pied de page.
              - &lien_libelle {label: "Libellé", name: libelle, widget: string, hint: "Le texte cliquable."}
              - &lien_adresse {label: "Adresse", name: url, widget: string, hint: "Une page du site, par exemple /catalogue/, ou une adresse complète commençant par https://."}
              - {label: "Visible", name: visible, widget: boolean, default: true}
          - label: Recherche
            name: recherche
            widget: object
            collapsed: true
            summary: "{{fields.libelle}} — {{fields.url}}"
            hint: La loupe de l’en-tête, et le lien « Rechercher » du menu sur téléphone.
            fields:
              - *lien_libelle
              - *lien_adresse
      - name: footer
        label: Pied de page
        file: nouveau-site/content/reglages/footer.json
        fields:
          - label: Présentation
            name: presentation
            widget: markdown
            modes: [rich_text]
            minimal: true
            buttons: *boutons_courts
            editor_components: []
          - {label: "Titre de la navigation", name: titreNavigation, widget: string}
          - label: Liens de navigation
            label_singular: lien
            name: liensNavigation
            widget: list
            min: 1
            collapsed: true
            summary: "{{fields.libelle}} — {{fields.url}}"
            hint: Glisser un lien par sa poignée pour changer sa place dans la colonne.
            fields:
              - *lien_libelle
              - *lien_adresse
          - {label: "Titre des informations", name: titreInformations, widget: string}
          - {label: "Libellé Facebook", name: libelleFacebook, widget: string}
          - {label: "Libellé Manuscrits", name: libelleManuscrits, widget: string}
          - {label: "Libellé Plan du site", name: libellePlan, widget: string}
          - {label: "Libellé Mentions légales", name: libelleMentions, widget: string}
      # Les libellés suivent l’ordre où ils apparaissent en descendant la page d’accueil.
      # « Rubrique » désigne partout la petite ligne en majuscules au-dessus d’un titre.
      - name: accueil
        label: Textes de l’accueil
        file: nouveau-site/content/reglages/accueil.json
        fields:
          - label: "1. Le bandeau d’ouverture"
            name: groupeBandeau
            widget: groupe
            required: false
            hint: "Tout en haut de l’accueil : le grand titre, son accroche et deux boutons."
          - label: Rubrique
            name: heroRubrique
            widget: string
            hint: La petite ligne tout en haut, au-dessus du grand titre.
          - label: Titre
            name: heroTitre
            widget: string
            hint: Le grand titre d’ouverture, en noir.
          - label: Suite du titre, en couleur
            name: heroAccent
            widget: string
            hint: La fin du grand titre, affichée en rouge à la suite du précédent.
          - label: Accroche
            name: heroAccroche
            widget: markdown
            modes: [rich_text]
            minimal: true
            buttons: *boutons_courts
            editor_components: []
            hint: La phrase sous le grand titre.
          - {label: "Bouton vers le catalogue", name: boutonCatalogue, widget: string}
          - {label: "Bouton vers les collections", name: boutonCollections, widget: string}
          - label: "2. Le bloc d’information"
            name: groupeInformation
            widget: groupe
            required: false
            hint: "L’encadré qui suit le bandeau ; son texte se modifie dans « Pages principales › Accueil »."
          - label: Titre
            name: titreInformation
            widget: string
            hint: Le bloc qui annonce la situation de la maison. Son texte, lui, s’écrit dans « Pages principales > Accueil ».
          - label: "3. Les collections"
            name: groupeCollections
            widget: groupe
            required: false
            hint: "La rangée des collections."
          - {label: "Rubrique", name: collectionsRubrique, widget: string}
          - {label: "Titre", name: collectionsTitre, widget: string}
          - label: "4. Suivre la maison"
            name: groupeSuivre
            widget: groupe
            required: false
            hint: "Le bandeau sombre du bas de l’accueil et ses deux cartes, Actualités et Manuscrits."
          - {label: "Rubrique", name: suivreRubrique, widget: string}
          - {label: "Titre", name: suivreTitre, widget: string}
          - {label: "Carte Actualités — rubrique", name: actualitesRubrique, widget: string}
          - {label: "Carte Actualités — titre", name: actualitesTitre, widget: string}
          - label: Carte Actualités — lien
            name: actualitesAction
            widget: string
            hint: Le texte cliquable au bas de la carte, par exemple « Lire les actualités ».
          - {label: "Carte Manuscrits — rubrique", name: manuscritsRubrique, widget: string}
          - {label: "Carte Manuscrits — titre", name: manuscritsTitre, widget: string}
          - {label: "Carte Manuscrits — lien", name: manuscritsAction, widget: string}
      # Le nom d’entrée n’est pas « pages » : l’aperçu de la rubrique Pages de la
      # maison s’appliquerait. Le fichier, lui, reste pages.json.
      - name: introductions
        label: Introductions des pages
        file: nouveau-site/content/reglages/pages.json
        fields:
          - label: Catalogue
            name: catalogue
            widget: object
            collapsed: true
            summary: "{{fields.titre}}"
            fields: &page_intro_fields
              - {label: "Rubrique", name: rubrique, widget: string, hint: "La petite ligne au-dessus du titre. Écrire {nombre} pour insérer le nombre réel de contenus, par exemple « {nombre} ouvrages »."}
              - {label: "Titre", name: titre, widget: string, hint: "Le grand titre de la page."}
              - label: Introduction
                name: introduction
                hint: "La phrase sous le titre."
                widget: markdown
                modes: [rich_text]
                minimal: true
                buttons: *boutons_courts
                editor_components: []
              - label: Description SEO
                name: descriptionSeo
                hint: "Affichée par les moteurs de recherche. {nombre} y est remplacé de la même façon. 160 caractères maximum."
                widget: description-seo
                modes: [rich_text]
                minimal: true
                buttons: []
                editor_components: []
          - label: Auteurs et illustrateurs
            name: personnes
            widget: object
            collapsed: true
            summary: "{{fields.titre}}"
            fields: *page_intro_fields
          - label: Collections
            name: collections
            widget: object
            collapsed: true
            summary: "{{fields.titre}}"
            fields: *page_intro_fields
          - label: Actualités
            name: actualites
            widget: object
            collapsed: true
            summary: "{{fields.titre}}"
            fields:
              - {label: "Rubrique", name: rubrique, widget: string}
              - {label: "Titre", name: titre, widget: string}
              - label: Introduction
                name: introduction
                widget: markdown
                modes: [rich_text]
                minimal: true
                buttons: *boutons_courts
                editor_components: []
              - label: Description SEO
                name: descriptionSeo
                widget: description-seo
                modes: [rich_text]
                minimal: true
                buttons: []
                editor_components: []
              - {label: "Rubrique du bloc Facebook", name: appelRubrique, widget: string}
              - {label: "Titre du bloc Facebook", name: appelTitre, widget: string}
              - label: Texte du bloc Facebook
                name: appelTexte
                widget: markdown
                modes: [rich_text]
                minimal: true
                buttons: *boutons_courts
                editor_components: []
              - {label: "Bouton Facebook", name: boutonFacebook, widget: string}
          - label: La maison
            name: maison
            widget: object
            collapsed: true
            summary: "{{fields.titre}}"
            fields: *page_intro_fields
      - name: paiement
        label: Paiement et dons
        file: nouveau-site/content/reglages/paiement.json
        fields:
          - label: "Les textes des boutons"
            name: groupeTextes
            widget: groupe
            required: false
            hint: "Ce que lit le visiteur sur les boutons et mentions d’achat."
          - {label: "Bouton d’achat d’un livre", name: libellePanier, widget: string}
          - {label: "Bouton « voir mon panier »", name: libelleVoirPanier, widget: string}
          - {label: "Mention « disponible »", name: libelleDisponible, widget: string}
          - {label: "Mention « indisponible »", name: libelleIndisponible, widget: string}
          - label: Bouton de contact d’un livre indisponible
            name: libelleContact
            widget: string
            hint: Il ouvre un courriel prérempli avec le titre du livre.
          - {label: "Bouton de lecture d’un extrait", name: libelleExtrait, widget: string}
          # Ce bloc doit rester dans le formulaire : ce qui n’y figure pas est effacé
          # du fichier au premier enregistrement, et le site ne se génèrerait plus.
          - {label: "Bouton « voir les offres » (accueil)", name: libelleOffres, widget: string}
          - {label: "Libellé du bouton de don", name: libelleDon, widget: string}
          # Les mots du parcours d’achat, réunis ici : ils changent avec les offres et le
          # mode de vente, pas avec le catalogue.
          - label: "Réglages techniques"
            name: groupeTechnique
            widget: groupe
            required: false
            hint: "Fournis par PayPal : à ne modifier qu’en recopiant exactement ce que donne PayPal."
          - label: Identifiant du bouton PayPal de don
            name: donationHostedButtonId
            widget: string
            hint: "Les 13 caractères fournis par PayPal lors de la création du bouton (par exemple 6A3X7AW598RVA), et non l’adresse complète. C’est lui qui décide de l’article et du montant facturés : une erreur fait payer autre chose que ce qu’annonce la page. Celui-ci reçoit les dons."
            # Le motif des identifiants PayPal, repris par les livres et les sections.
            pattern: &motif_paypal ['^[A-Z0-9]{13}$', "Treize caractères, en majuscules et chiffres uniquement"]
          - label: Bloc technique du bouton « voir mon panier »
            name: panierEncrypted
            widget: text
            hint: >-
              Code signé par PayPal, recopié de l’ancien site. À ne pas modifier ni
              effacer : sans lui, le site refuse de se générer. Il ne se remplace que
              par un nouveau bloc fourni par PayPal.
            pattern: ['^-----BEGIN PKCS7-----', "Le bloc doit commencer par -----BEGIN PKCS7-----"]
      # Contrat complet : docs/CONTRAT-APPARENCE.md. Aucun champ de CSS libre : des
      # couleurs #RRGGBB (sélecteur sans transparence, motif en garde-fou pour la
      # saisie au clavier) et des polices choisies dans une liste fermée.
      - name: apparence
        label: Apparence
        file: nouveau-site/content/reglages/apparence.json
        fields:
          - label: Fond du site
            name: couleurFond
            widget: color
            allowInput: true
            enableAlpha: false
            pattern: &couleur ['^#[0-9A-Fa-f]{6}$', "Choisir une couleur, ou la saisir au format #RRGGBB (par exemple #c63f32)"]
            hint: >-
              Le fond général des pages et de l’en-tête. Les tailles, les espacements et
              la mise en page restent protégés : ici, seules les couleurs et les polices
              changent. Valeur d’origine : #f7f7f4.
          - {label: "Fond des cartes", name: couleurSurface, widget: color, allowInput: true, enableAlpha: false, pattern: *couleur, hint: "Les cartes, les bandeaux blancs et les champs de recherche. Valeur d’origine : #ffffff."}
          - {label: "Texte principal", name: couleurTexte, widget: color, allowInput: true, enableAlpha: false, pattern: *couleur, hint: "Le texte courant et les titres. Valeur d’origine : #171a18."}
          - {label: "Texte secondaire", name: couleurTexteSecondaire, widget: color, allowInput: true, enableAlpha: false, pattern: *couleur, hint: "Les textes discrets : fil d’Ariane, légendes, dates. Valeur d’origine : #626862."}
          - {label: "Couleur principale", name: couleurPrincipale, widget: color, allowInput: true, enableAlpha: false, pattern: *couleur, hint: "L’accent de la maison : « d’orties », l’onglet actif, les filets, la 1re collection. Valeur d’origine : #c63f32."}
          - {label: "Couleur principale foncée", name: couleurPrincipaleFoncee, widget: color, allowInput: true, enableAlpha: false, pattern: *couleur, hint: "Le survol des liens et des boutons. Valeur d’origine : #963128."}
          - {label: "Couleur secondaire", name: couleurSecondaire, widget: color, allowInput: true, enableAlpha: false, pattern: *couleur, hint: "Les surtitres, les citations, la mention « disponible », la 2e collection. Valeur d’origine : #3e6b50."}
          - {label: "Liens", name: couleurLiens, widget: color, allowInput: true, enableAlpha: false, pattern: *couleur, hint: "Les liens dans les textes et la 3e collection. Valeur d’origine : #275c7a."}
          - {label: "Boutons", name: couleurBoutons, widget: color, allowInput: true, enableAlpha: false, pattern: *couleur, hint: "Le fond des boutons pleins ; leur texte reste blanc, choisir une couleur foncée. Valeur d’origine : #171a18."}
          - label: Police des titres
            name: policeTitres
            widget: select
            hint: "Valeur d’origine : Classique à empattements (Georgia)."
            options: &polices
              - {label: "Classique à empattements (Georgia)", value: serif-classique}
              - {label: "Livre à empattements (Palatino)", value: serif-livre}
              - {label: "Moderne sans empattements (Inter)", value: sans-serif-moderne}
              - {label: "Humaniste sans empattements", value: sans-serif-humaniste}
          - {label: "Police des textes", name: policeTexte, widget: select, options: *polices, hint: "Valeur d’origine : Moderne sans empattements (Inter)."}

  # L’ordre des champs suit la façon dont on décrit un livre : de quoi il s’agit, qui
  # l’a fait, ce qu’il raconte, à quoi il ressemble, comment on l’achète, où il se
  # range. Les réglages techniques ferment la marche.
  - name: livres
    label: Livres
    label_singular: Livre
    description: >-
      Les ouvrages publiés, un par fiche. La suppression est désactivée : pour retirer
      un livre du site, passer son statut à « Archivé ».
    folder: nouveau-site/content/livres
    extension: json
    format: json
    create: true
    delete: false
    identifier_field: titre
    slug: "{{fields.slug}}"
    summary: "{{titre}} — {{statut}}"
    preview_path: "livres/{{slug}}/"
    view_groups:
      - {label: "Collection", field: collection}
      - {label: "Publication", field: statut}
    sortable_fields: [titre, collection, ordre, statut]
    view_filters: &status_filters
      - {label: "Publiés", field: statut, pattern: "publie"}
      - {label: "Brouillons", field: statut, pattern: "brouillon"}
      - {label: "Archivés", field: statut, pattern: "archive"}
    fields:
      - label: "L’essentiel"
        name: groupe1
        widget: groupe
        required: false
        hint: "Ce que le lecteur voit en premier sur la fiche du livre."
      - {label: "Titre", name: titre, widget: string}
      - &publication
        label: Publication
        name: statut
        widget: select
        default: publie
        hint: « Brouillon » n’apparaît que dans l’aperçu, « Archivé » disparaît du site sans être effacé.
        options:
          - {label: "Publié", value: publie}
          - {label: "Brouillon", value: brouillon}
          - {label: "Archivé", value: archive}
      - label: Collection
        name: collection
        widget: relation
        collection: collections
        hint: La collection où le livre est rangé sur le site.
        search_fields: [titre]
        display_fields: [titre]
        value_field: slug
      - label: Auteurs
        name: auteurs
        widget: relation
        collection: personnes
        multiple: true
        min: 1
        # Pas de filtre par rôle : roles est une liste, et le filtre de Decap compare
        # la valeur entière (values.includes(liste)) — aucune fiche ne passerait.
        hint: "Choisir dans les fiches « Auteurs et illustrateurs ». Une personne absente de la liste doit d’abord y être créée."
        search_fields: [nom]
        display_fields: [nom]
        value_field: slug
      # Les illustrateurs sont facultatifs dans un livre comme dans un projet : un seul
      # champ pour les deux. Les auteurs, eux, sont obligatoires dans un livre seulement.
      - &illustrateurs
        label: Illustrateurs
        name: illustrateurs
        widget: relation
        collection: personnes
        multiple: true
        required: false
        hint: "Choisir dans les fiches « Auteurs et illustrateurs ». Une personne absente de la liste doit d’abord y être créée."
        search_fields: [nom]
        display_fields: [nom]
        value_field: slug
      - label: Préfaciers
        name: prefaciers
        widget: relation
        collection: personnes
        multiple: true
        required: false
        hint: "Choisir dans les fiches « Auteurs et illustrateurs ». Une personne absente de la liste doit d’abord y être créée."
        search_fields: [nom]
        display_fields: [nom]
        value_field: slug
      - label: Couverture
        name: couverture
        widget: image
        allow_multiple: false
        hint: Obligatoire. Format portrait de préférence, 20 Mo maximum.
        media_library: &media_20_mo {config: {max_file_size: 20971520}}
      - label: Texte alternatif de la couverture
        name: couvertureAlt
        widget: string
        required: false
        hint: Une courte description de l’image, lue par les personnes qui ne la voient pas. Laisser vide écrit « Couverture de <titre> ».
      - label: Présentation
        name: description
        widget: markdown
        modes: [rich_text]
        minimal: true
        buttons: *boutons_courts
        editor_components: []
        required: false
        hint: Le texte de présentation, affiché sur la page du livre et repris comme description pour les moteurs de recherche.
      - label: "Vente"
        name: groupe2
        widget: groupe
        required: false
        hint: "Le prix et le bouton d’achat."
      - label: Prix en euros
        name: prixEuros
        widget: number
        value_type: float
        min: 0
        step: 0.01
        required: false
        hint: Séparer les centimes par une virgule, par exemple 11,50.
      - label: Disponible
        name: disponible
        widget: boolean
        default: true
        hint: Décoché, le livre affiche « Actuellement indisponible » et un bouton de contact au lieu du bouton d’achat.
      - label: Identifiant du bouton PayPal
        name: paypalHostedButtonId
        widget: string
        required: false
        hint: "Les 13 caractères fournis par PayPal lors de la création du bouton (par exemple 6A3X7AW598RVA), et non l’adresse complète. C’est lui qui décide de l’article et du montant facturés : une erreur fait payer autre chose que ce qu’annonce la page. Obligatoire pour un livre disponible : sans lui, la publication est refusée."
        pattern: *motif_paypal
      - label: "Caractéristiques du livre"
        name: groupe3
        widget: groupe
        required: false
        hint: "Affichées dans l’encadré de la fiche."
      - label: Type d’ouvrage
        name: typeOuvrage
        widget: select
        required: false
        hint: Affiché sous le titre, avec l’âge.
        options:
          - {label: "Album", value: album}
          - {label: "Album jeunesse", value: album-jeunesse}
          - {label: "Mini roman", value: mini-roman}
          - {label: "Mini roman jeunesse", value: mini-roman-jeunesse}
          - {label: "Nouvelles", value: nouvelles}
          - {label: "Recueil de nouvelles", value: recueil-de-nouvelles}
          # Ces deux-là manquaient à la liste alors que deux livres les portaient : les
          # ouvrir dans l’administration aurait effacé leur type sans prévenir.
          - {label: "Recueil de récits", value: recueil-de-recits}
          - {label: "Recueil de textes", value: recueil-de-textes}
          - {label: "Roman", value: roman}
          - {label: "Roman jeunesse", value: roman-jeunesse}
          - {label: "Texte illustré", value: texte-illustre}
      - label: Âge minimum
        name: ageMinimum
        widget: number
        value_type: int
        min: 0
        required: false
        hint: Le site écrit « Dès 7 ans » à partir de ce nombre.
      - {label: "Nombre de pages", name: nombrePages, widget: number, value_type: int, min: 1, required: false}
      - label: Format
        name: format
        widget: string
        required: false
        hint: Largeur puis hauteur en centimètres, par exemple « 18,5 x 18,5 ».
      - label: Reliure
        name: reliure
        widget: select
        required: false
        options:
          - {label: "Souple", value: souple}
          - {label: "Cartonnée", value: cartonne}
      - label: ISBN
        name: isbn
        widget: string
        required: false
        hint: 10 ou 13 chiffres, sans tiret. Un ISBN invalide bloque la publication.
        pattern: ['^(?:[0-9]{10}|[0-9]{13})$', "Saisir un ISBN à 10 ou 13 chiffres"]
      - label: ISSN de la collection
        name: issnCollection
        widget: string
        required: false
        hint: Conservé pour les démarches administratives. Il n’apparaît nulle part sur le site.
      - label: "Images et extraits"
        name: groupe4
        widget: groupe
        required: false
        hint: "Pages intérieures et extraits à télécharger."
      - label: Illustrations
        name: illustrations
        label_singular: "illustration"
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.alt}}"
        hint: Les images intérieures, affichées dans la galerie « Quelques illustrations ».
        # Une image et son texte alternatif : les mêmes champs dans toutes les galeries.
        fields: &image_et_alt
          - {label: "Image", name: image, widget: image, allow_multiple: false, media_library: *media_20_mo}
          - {label: "Texte alternatif", name: alt, widget: string, required: false, hint: "Une courte description de l’image, lue par les personnes qui ne la voient pas."}
      - label: Extraits PDF
        name: extraits
        label_singular: "extrait PDF"
        widget: list
        required: false
        collapsed: true
        hint: Les fichiers proposés au téléchargement sur la page du livre.
        field: {label: "PDF", name: document, widget: file, allow_multiple: false, media_library: *media_20_mo}
      - label: "Mise en avant"
        name: groupe5
        widget: groupe
        required: false
        hint: "Pour faire apparaître le livre sur l’accueil et proposer des lectures voisines."
      - label: Mis en avant sur l’accueil
        name: miseEnAvantAccueil
        widget: boolean
        default: false
        hint: Chaque collection met en avant exactement un livre disponible. En cocher un second dans la même collection bloque la publication.
      - label: Ordre sur l’accueil
        name: ordreAccueil
        widget: number
        value_type: int
        min: 0
        default: 999
        hint: Ne sert que si le livre est mis en avant. Laisser 999 sinon.
      - label: À découvrir aussi
        name: aDecouvrir
        widget: relation
        collection: livres
        multiple: true
        max: 4
        required: false
        hint: Quatre livres au maximum, suggérés en bas de la page.
        search_fields: [titre]
        display_fields: [titre]
        value_field: slug
      - label: "Réglages techniques"
        name: groupe6
        widget: groupe
        required: false
        hint: "À ne modifier qu’en cas de besoin : l’adresse de la page, son rang dans les listes, les anciennes adresses redirigées et le référencement dans les moteurs de recherche."
      - label: Adresse de la page
        name: slug
        widget: string
        hint: "La fin de l’adresse de la page, par exemple « ville-rouge » pour /livres/ville-rouge/. À ne plus modifier après la première publication : ajouter plutôt l’ancienne adresse dans « Anciennes adresses », juste en dessous."
        # Le motif des adresses, repris par toutes les rubriques.
        pattern: &motif_adresse ['^[a-z0-9]+(?:-[a-z0-9]+)*$', "Minuscules, chiffres et tirets uniquement, sans espace ni accent"]
      - &order
        label: Ordre d’affichage
        name: ordre
        widget: number
        value_type: int
        min: 0
        default: 100
        hint: "Du plus petit au plus grand. Deux contenus ne peuvent pas partager le même rang : la publication serait refusée."
      - &old_slugs
        label: Anciennes adresses
        name: anciensSlugs
        label_singular: "ancienne adresse"
        widget: list
        required: false
        collapsed: true
        hint: Les adresses de l’ancien site, redirigées vers celle-ci. À compléter si l’adresse ci-dessus change.
        field: {label: "Ancienne adresse", name: adresse, widget: string}
      - &seo
        label: Référencement SEO
        name: seo
        widget: object
        required: false
        collapsed: true
        hint: "Facultatif : sans rien ici, le site reprend le titre et la présentation."
        fields:
          - {label: "Titre SEO", name: titre, widget: string, required: false, pattern: ['^.{0,60}$', "60 caractères maximum"], hint: "60 caractères maximum. Laisser vide pour utiliser le titre du contenu."}
          - label: Description SEO
            name: description
            required: false
            pattern: ['^[\s\S]{0,160}$', "160 caractères maximum"]
            hint: "160 caractères maximum. Laisser vide pour utiliser la description du contenu."
            widget: description-seo
            modes: [rich_text]
            minimal: true
            buttons: []
            editor_components: []
          - {label: "Image sociale", name: image, widget: image, allow_multiple: false, required: false, media_library: *media_20_mo, hint: "Utilisée quand un lien vers cette page est partagé sur les réseaux sociaux."}

  - name: personnes
    label: Auteurs et illustrateurs
    label_singular: Personne
    description: >-
      Une fiche par personne. Le rôle choisi ici décide dans quelles listes elle
      apparaîtra au moment de renseigner un livre.
    folder: nouveau-site/content/personnes
    extension: json
    format: json
    create: true
    delete: false
    identifier_field: nom
    slug: "{{fields.slug}}"
    summary: "{{nom}} — {{statut}}"
    preview_path: "personnes/{{slug}}/"
    view_groups:
      - {label: "Initiale du nom", field: nom, pattern: "^."}
      - {label: "Publication", field: statut}
    sortable_fields: [nom, ordre, statut]
    view_filters: *status_filters
    fields:
      - label: "L’essentiel"
        name: groupe1
        widget: groupe
        required: false
        hint: "La fiche de l’auteur ou de l’illustrateur."
      - {label: "Nom", name: nom, widget: string}
      - *publication
      - label: Rôles
        name: roles
        widget: select
        multiple: true
        min: 1
        default: [auteur]
        hint: Une personne peut cumuler plusieurs rôles. Le rôle classe la personne sur le site ; dans un livre, toutes les fiches sont proposées.
        options:
          - {label: "Auteur", value: auteur}
          - {label: "Illustrateur", value: illustrateur}
          - {label: "Préfacier", value: prefacier}
      - {label: "Portrait principal", name: imagePrincipale, widget: image, allow_multiple: false, required: false, media_library: *media_20_mo}
      - label: Texte alternatif du portrait
        name: imagePrincipaleAlt
        widget: string
        required: false
        hint: Une courte description de l’image, lue par les personnes qui ne la voient pas. Laisser vide écrit « Portrait de <nom> ».
      - label: Biographie
        name: biographie
        widget: markdown
        modes: [rich_text]
        minimal: true
        buttons: *boutons_courts
        editor_components: []
        required: false
        hint: Affichée en tête de la fiche, au-dessus de ses livres.
      - label: "Images et liens"
        name: groupe2
        widget: groupe
        required: false
        hint: "Autres images et sites de la personne."
      - label: Autres images
        name: images
        label_singular: "image"
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.alt}}"
        hint: Affichées dans une galerie sous la biographie.
        fields: *image_et_alt
      - label: Liens externes
        name: liensExternes
        label_singular: "lien"
        widget: list
        required: false
        collapsed: true
        hint: Site personnel, blog… Le premier devient le bouton « Site personnel ».
        field: {label: "Adresse web", name: url, widget: string, pattern: ['^https?://', "L’adresse doit commencer par http:// ou https://"]}
      - label: "Réglages techniques"
        name: groupe3
        widget: groupe
        required: false
        hint: "À ne modifier qu’en cas de besoin : l’adresse de la page, son rang dans les listes, les anciennes adresses redirigées et le référencement dans les moteurs de recherche."
      - label: Adresse de la page
        name: slug
        widget: string
        hint: "La fin de l’adresse de la page, par exemple « laure-philippon » pour /personnes/laure-philippon/. À ne plus modifier après la première publication : ajouter plutôt l’ancienne adresse dans « Anciennes adresses », juste en dessous."
        pattern: *motif_adresse
      - *order
      - *old_slugs
      - *seo

  - name: collections
    label: Collections
    label_singular: Collection
    description: >-
      Les six collections de la maison. Une collection publiée doit contenir au moins un
      livre publié, dont exactement un mis en avant sur l’accueil.
    folder: nouveau-site/content/collections
    extension: json
    format: json
    create: true
    delete: false
    identifier_field: titre
    slug: "{{fields.slug}}"
    summary: "{{titre}} — {{statut}}"
    preview_path: "collections/{{slug}}/"
    sortable_fields: [ordre, titre, statut]
    view_filters: *status_filters
    fields:
      - label: "L’essentiel"
        name: groupe1
        widget: groupe
        required: false
        hint: "La page de la collection."
      - {label: "Nom", name: titre, widget: string}
      - *publication
      - label: Emblème
        name: logo
        widget: image
        allow_multiple: false
        required: false
        hint: Le petit dessin de la collection, sur fond transparent, repris de l’ancien site.
        media_library: *media_20_mo
      - label: Texte alternatif de l’emblème
        name: logoAlt
        widget: string
        required: false
        hint: Une courte description de l’image, lue par les personnes qui ne la voient pas. Obligatoire dès qu’un emblème est choisi, sinon la publication est refusée. Par exemple « Un chardon violet ».
      - label: Présentation
        name: description
        widget: markdown
        modes: [rich_text]
        minimal: true
        buttons: *boutons_courts
        editor_components: []
        required: true
        hint: Une ou deux phrases, reprises sur l’accueil et sur la page Collections.
      - label: "Réglages techniques"
        name: groupe2
        widget: groupe
        required: false
        hint: "À ne modifier qu’en cas de besoin : l’adresse de la page, son rang dans les listes, les anciennes adresses redirigées et le référencement dans les moteurs de recherche."
      - label: Adresse de la page
        name: slug
        widget: string
        hint: "La fin de l’adresse de la page, par exemple « rues-en-friche » pour /collections/rues-en-friche/. À ne plus modifier après la première publication : ajouter plutôt l’ancienne adresse dans « Anciennes adresses », juste en dessous."
        pattern: *motif_adresse
      - *order
      - *old_slugs
      - *seo

  - name: actualites
    label: Actualités
    label_singular: Actualité
    description: >-
      Les articles de la page Actualités, du plus récent au plus ancien. Le titre et
      l’introduction de la page, eux, se règlent dans « Réglages du site > Introductions
      des pages > Actualités ».
    folder: nouveau-site/content/actualites
    extension: json
    format: json
    create: true
    delete: false
    identifier_field: titre
    slug: "{{fields.slug}}"
    summary: "{{datePublication | date('DD/MM/YYYY')}} — {{titre}} — {{statut}}"
    preview_path: "actualites/"
    view_groups:
      - {label: "Catégorie", field: type}
      - {label: "Année", field: datePublication, pattern: "^\\d{4}"}
    sortable_fields: [datePublication, titre, statut]
    view_filters: *status_filters
    fields:
      - label: "L’essentiel"
        name: groupe1
        widget: groupe
        required: false
        hint: "Ce qui s’affiche dans la liste des actualités et sur l’accueil."
      - {label: "Titre", name: titre, widget: string}
      - *publication
      - label: Date
        name: datePublication
        widget: datetime
        date_format: "DD/MM/YYYY"
        time_format: false
        format: "YYYY-MM-DD"
        hint: "Elle décide de la place de l’article dans la liste : la plus récente en premier."
      - label: Catégorie
        name: type
        widget: select
        hint: Affichée sur l’article, et reprise dans la liste des catégories en bas de page.
        options:
          - {label: "Salon", value: salon}
          - {label: "Parution", value: parution}
          - {label: "Rencontre", value: rencontre}
          - {label: "Vie de la maison", value: maison}
      - {label: "Image", name: image, widget: image, allow_multiple: false, required: false, media_library: *media_20_mo}
      - label: Texte alternatif de l’image
        name: imageAlt
        widget: string
        required: false
        hint: Une courte description de l’image, lue par les personnes qui ne la voient pas. Obligatoire dès qu’une image est choisie, sinon la publication est refusée.
      - label: Résumé
        name: resume
        widget: markdown
        modes: [rich_text]
        minimal: true
        buttons: *boutons_courts
        editor_components: []
        hint: Une ou deux phrases, mises en avant au-dessus du texte.
      - label: "Article complet"
        name: groupe2
        widget: groupe
        required: false
        hint: "Le texte de la page de l’actualité, et ses compléments."
      - label: Contenu
        name: contenu
        widget: markdown
        modes: [rich_text]
        # Les seuls outils utiles à la rédaction : le barré, le code et six niveaux de
        # titre déroutaient plus qu'ils ne servaient. Le texte déjà saisi n'est pas touché.
        buttons: &boutons_corps [bold, italic, link, heading-two, heading-three,
                  bulleted-list, numbered-list, quote]
        editor_components: [image]
        hint: Le texte de l’article. Laisser une ligne vide entre deux paragraphes.
      - label: Lien externe
        name: lienExterne
        widget: string
        required: false
        hint: Ajoute un bouton « En savoir plus » sous l’article.
        pattern: ['^https?://', "L’adresse doit commencer par http:// ou https://"]
      - label: Document PDF
        name: document
        widget: file
        allow_multiple: false
        required: false
        hint: Ajoute un bouton de téléchargement sous l’article.
        media_library: *media_20_mo
      - label: "Réglages techniques"
        name: groupe3
        widget: groupe
        required: false
        hint: "À ne modifier qu’en cas de besoin : l’adresse de la page, son rang dans les listes, les anciennes adresses redirigées et le référencement dans les moteurs de recherche."
      - label: Identifiant
        name: slug
        widget: string
        hint: "Le nom du fichier, en minuscules et tirets. Une actualité n’a pas de page à elle : elle s’affiche dans la liste des actualités."
        pattern: *motif_adresse
      - *old_slugs
      - *seo

  # Les livres à paraître. Ils n’ont pas de page à eux : ils s’affichent sur la page
  # Projets, sous son introduction. La suppression est donc autorisée ici — contrairement
  # aux livres et aux pages, aucun projet n’a d’adresse à rediriger, et un projet paru
  # n’a plus de raison d’encombrer la liste.
  - name: projets
    label: Projets
    label_singular: Projet
    description: >-
      Les livres à paraître. Ils s’affichent sur la page Projets, sous son introduction —
      laquelle s’écrit dans « Pages de la maison > Projets ». C’est la seule rubrique où
      la suppression est possible : le jour de la parution, supprimer le projet et créer
      le livre.
    folder: nouveau-site/content/projets
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: titre
    slug: "{{fields.slug}}"
    summary: "{{titre}} — sortie {{sortiePrevue}}"
    preview_path: "projets/"
    view_groups:
      - {label: "Publication", field: statut}
    sortable_fields: [ordre, titre, statut]
    view_filters: *status_filters
    fields:
      - label: "L’essentiel"
        name: groupe1
        widget: groupe
        required: false
        hint: "Un livre en préparation, présenté sur la page Projets."
      - {label: "Titre", name: titre, widget: string}
      - *publication
      - label: Description
        name: description
        widget: string
        required: false
        hint: Le genre et le public, par exemple « Album pour les 3-5 ans ».
      - label: Collection
        name: collection
        widget: relation
        required: false
        collection: collections
        hint: Facultative tant que le projet n’est pas rattaché à une collection.
        search_fields: [titre]
        display_fields: [titre]
        value_field: slug
      - label: Sortie prévue
        name: sortiePrevue
        widget: string
        required: false
        hint: Écrire la période telle qu’elle doit paraître, par exemple « décembre 2026 ».
      - label: "Auteurs et illustrateurs"
        name: groupe2
        widget: groupe
        required: false
        hint: "Choisir dans les fiches existantes ; le nom deviendra un lien vers la fiche. Une personne qui n’en a pas encore s’écrit dans « … sans fiche »."
      - label: Auteurs
        name: auteurs
        widget: relation
        collection: personnes
        multiple: true
        required: false
        hint: "Choisir dans les fiches « Auteurs et illustrateurs ». Une personne absente de la liste doit d’abord y être créée. Sinon, l’écrire dans « Auteurs sans fiche »."
        search_fields: [nom]
        display_fields: [nom]
        value_field: slug
      - label: Auteurs sans fiche
        name: auteursHorsFiche
        label_singular: "auteur sans fiche"
        widget: list
        required: false
        hint: Pour un auteur qui n’a pas encore de fiche — courant avant parution. Son nom s’affichera sans lien.
        field: {label: "Nom", name: nom, widget: string}
      - *illustrateurs
      - label: Illustrateurs sans fiche
        name: illustrateursHorsFiche
        label_singular: "illustrateur sans fiche"
        widget: list
        required: false
        hint: Pour un illustrateur qui n’a pas encore de fiche. Son nom s’affichera sans lien.
        field: {label: "Nom", name: nom, widget: string}
      - label: "Réglages techniques"
        name: groupe3
        widget: groupe
        required: false
        hint: "À ne modifier qu’en cas de besoin."
      - label: Identifiant
        name: slug
        widget: string
        hint: "Le nom du fichier, en minuscules et tirets. Un projet n’a pas de page à lui : il s’affiche sur la page Projets."
        pattern: *motif_adresse
      - *order

  - name: pages_fixes
    label: Pages principales
    description: >-
      Le titre et le texte de la page Actualités ne se règlent pas ici mais dans
      « Réglages du site > Introductions des pages > Actualités ». Cette page est
      engendrée : ses articles viennent de la rubrique Actualités.
    format: json
    delete: false
    files:
      - name: page_accueil
        label: Accueil
        file: nouveau-site/content/pages-fixes/accueil.json
        preview_path: "index.html"
        fields:
          - {label: "Titre", name: titre, widget: string}
          - {label: "Adresse", name: slug, widget: hidden, default: accueil}
          - {label: "Publication", name: statut, widget: hidden, default: publie}
          - {label: "Type", name: type, widget: hidden, default: accueil}
          - {label: "Ordre", name: ordre, widget: hidden, default: 0}
          - label: Sections de l’accueil
            name: sections
            label_singular: "section"
            widget: list
            min: 6
            max: 6
            summary: "{{fields.titre | default('Section sans intertitre')}}"
            fields:
              - {label: "Identifiant", name: id, widget: hidden}
              - {label: "Titre", name: titre, widget: string}
              - label: Texte
                name: contenu
                widget: markdown
                modes: [rich_text]
                buttons: *boutons_corps
                editor_components: [image]
          - {label: "Liens", name: liens, widget: hidden, default: []}
          - {label: "Images", name: images, widget: hidden, default: []}
          - {label: "Documents", name: documents, widget: hidden, default: []}
          - *old_slugs
          - *seo
      # La page Actualités est engendrée : son titre, son introduction et son appel
      # viennent de « Réglages du site > Introductions des pages », et la liste des
      # articles de la collection Actualités. Seuls le référencement et les anciennes
      # adresses se règlent ici ; les autres champs sont masqués pour ne pas laisser
      # croire qu’écrire dedans changerait la page.
      - name: page_actualites
        label: Actualités — référencement seulement
        file: nouveau-site/content/pages-fixes/actualites.json
        preview_path: "actualites/"
        fields:
          - {label: "Titre", name: titre, widget: hidden, default: Actualités}
          - {label: "Adresse", name: slug, widget: hidden, default: actualites}
          - {label: "Publication", name: statut, widget: hidden, default: publie}
          - {label: "Type", name: type, widget: hidden, default: actualites}
          - {label: "Ordre", name: ordre, widget: hidden, default: 10}
          - label: Texte de référence
            name: sections
            widget: hidden
            default:
              - titre: null
                contenu: >-
                  Cette page est engendrée : son texte se règle dans « Réglages du site >
                  Introductions des pages > Actualités », et les articles s’ajoutent dans
                  la collection Actualités.
          - {label: "Liens", name: liens, widget: hidden, default: []}
          - {label: "Images", name: images, widget: hidden, default: []}
          - {label: "Documents", name: documents, widget: hidden, default: []}
          - *old_slugs
          - *seo
      - name: page_mentions_legales
        label: Mentions légales
        file: nouveau-site/content/pages-fixes/mentions-legales.json
        preview_path: "mentions-legales/"
        fields:
          # Page légale obligatoire : son adresse et son statut restent figés,
          # comme pour l’accueil et les actualités.
          - {label: "Titre", name: titre, widget: string}
          - {label: "Adresse", name: slug, widget: hidden, default: mentions-legales}
          - {label: "Publication", name: statut, widget: hidden, default: publie}
          - *order
          - {label: "Type", name: type, widget: hidden, default: legal}
          - &page_eyebrow
            label: Rubrique de la carte
            name: rubrique
            widget: string
            required: false
            hint: La petite ligne au-dessus du titre, sur la carte de la page « La maison ». Vide, le nom de la maison la remplace.
          - &page_action
            label: Libellé du lien de la carte
            name: libelleAction
            widget: string
            required: false
            hint: Le texte cliquable au bas de cette même carte, par exemple « Découvrir les projets ».
          - &page_sections
            label: Sections
            name: sections
            label_singular: "section"
            widget: list
            min: 1
            summary: "{{fields.titre | default('Section sans intertitre')}}"
            hint: "Le corps de la page. Une section par idée : un intertitre facultatif et un texte. La première sert aussi de résumé sur la page « La maison »."
            fields:
              - {label: "Intertitre", name: titre, widget: string, required: false}
              - label: Texte
                name: contenu
                widget: markdown
                modes: [rich_text]
                buttons: *boutons_corps
                editor_components: [image]
              - label: Livres de cette section
                name: livres
                widget: relation
                collection: livres
                multiple: true
                required: false
                search_fields: [titre]
                display_fields: [titre]
                value_field: slug
                hint: >-
                  Facultatif. Les livres choisis s’affichent sous le texte, avec leur
                  couverture, leurs auteurs et leur prix tirés de leur fiche : rien à
                  recopier. Pratique pour une offre groupée ou une sélection.
              - label: Boutons d’achat PayPal
                name: boutonsPaypal
                label_singular: "bouton PayPal"
                widget: list
                required: false
                collapsed: true
                summary: "{{fields.libelle}}"
                hint: >-
                  À n’utiliser que pour vendre depuis cette page : une offre groupée, une
                  adhésion, un don, un titre soldé. Pour vendre un livre à son prix normal,
                  le bouton se saisit dans sa fiche, pas ici.
                fields:
                  - {label: "Texte du bouton", name: libelle, widget: string, hint: "Ce que lit le visiteur, par exemple « Commander les deux tomes — 25 € »."}
                  - label: Identifiant du bouton PayPal
                    name: hostedButtonId
                    widget: string
                    hint: "Les 13 caractères fournis par PayPal lors de la création du bouton (par exemple 6A3X7AW598RVA), et non l’adresse complète. C’est lui qui décide de l’article et du montant facturés : une erreur fait payer autre chose que ce qu’annonce la page."
                    pattern: *motif_paypal
          # Trois champs pour cinq types de lien : le type choisi décide de celui qu’il
          # faut remplir, d’où les explications sur chacun.
          - &page_links
            label: Liens et documents
            name: liens
            label_singular: "lien"
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.texte}}"
            hint: Affichés dans l’encadré « Liens et documents », à droite de la page.
            fields:
              - label: Type de lien
                name: type
                widget: select
                default: externe
                options:
                  - {label: "Vers un autre site", value: externe}
                  - {label: "Vers une adresse courriel", value: email}
                  - {label: "Vers un document PDF", value: document}
                  - {label: "Vers un livre du catalogue", value: livre}
                  - {label: "Vers une autre page du site", value: page}
              - {label: "Libellé", name: texte, widget: string, required: false, hint: "Le texte cliquable. Vide, l’adresse s’affiche telle quelle."}
              - label: Adresse ou fichier
                name: href
                widget: string
                required: false
                hint: Pour « autre site » l’adresse complète (https://…), pour « courriel » mailto:adresse@exemple.fr, pour « document PDF » le chemin du fichier. À laisser vide pour un livre ou une page, choisis plus bas.
              # Choisis dans une liste plutôt que tapés : une faute de frappe dans une
              # adresse ne se voyait qu’au moment de publier.
              - label: Livre visé
                name: slug
                widget: relation
                collection: livres
                required: false
                search_fields: [titre]
                display_fields: [titre]
                value_field: slug
                hint: Uniquement pour un lien « Vers un livre du catalogue ».
              - label: Page visée
                name: pageCible
                widget: relation
                collection: pages
                required: false
                search_fields: [titre]
                display_fields: [titre]
                value_field: slug
                hint: Uniquement pour un lien « Vers une autre page du site ».
          - &page_images
            label: Images
            name: images
            label_singular: "image"
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.alt}}"
            hint: Affichées dans une galerie « En images » au bas de la page.
            fields: *image_et_alt
          - &page_documents
            label: Documents joints
            name: documents
            label_singular: "document"
            widget: list
            required: false
            collapsed: true
            hint: Fichiers déposés avec la page. Pour qu’un document soit cliquable, ajouter aussi un lien de type « document PDF » ci-dessus.
            field: {label: "PDF", name: document, widget: file, allow_multiple: false, media_library: *media_20_mo}
          - *old_slugs
          - *seo

  - name: pages
    label: Pages de la maison
    label_singular: Page
    description: >-
      Les pages libres — commandes, librairies, soutien, projets… Chacune apparaît sous
      forme de carte sur la page « La maison ». La page Projets porte ici son
      introduction ; la liste des projets, elle, vient de la rubrique Projets.
    folder: nouveau-site/content/pages
    extension: json
    format: json
    create: true
    delete: false
    identifier_field: titre
    slug: "{{fields.slug}}"
    summary: "{{titre}} — {{statut}}"
    preview_path: "{{slug}}/"
    view_groups:
      - {label: "Publication", field: statut}
    sortable_fields: [ordre, titre, statut]
    view_filters: *status_filters
    fields:
      - label: "L’essentiel"
        name: groupe1
        widget: groupe
        required: false
        hint: "Le titre et le texte de la page, découpé en sections."
      - {label: "Titre", name: titre, widget: string}
      - *publication
      - *page_sections
      - label: "Images, liens et documents"
        name: groupe2
        widget: groupe
        required: false
        hint: "Affichés à côté et au bas du texte."
      - *page_images
      - *page_links
      - *page_documents
      - label: "Carte sur la page « La maison »"
        name: groupe3
        widget: groupe
        required: false
        hint: "Chaque page y apparaît sous forme de carte."
      - *page_eyebrow
      - *page_action
      - label: "Réglages techniques"
        name: groupe4
        widget: groupe
        required: false
        hint: "À ne modifier qu’en cas de besoin : l’adresse de la page, son rang dans les listes, les anciennes adresses redirigées et le référencement dans les moteurs de recherche."
      - label: Adresse de la page
        name: slug
        widget: string
        hint: "La fin de l’adresse de la page, par exemple « commandes » pour /commandes/. À ne plus modifier après la première publication : ajouter plutôt l’ancienne adresse dans « Anciennes adresses », juste en dessous."
        pattern: *motif_adresse
      - {label: "Type", name: type, widget: hidden, default: page}
      - *order
      - *old_slugs
      - *seo
