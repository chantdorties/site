<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <!-- Reprise de l’en-tête Content-Security-Policy de l’hébergement OVH
       (admin-serveur/htaccess.conf) : chez Free, aucun en-tête ne peut être réglé.
       Le port 8082 est celui du serveur local de « make admin ». -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://api.github.com http://127.0.0.1:8082; frame-src 'self' blob:; worker-src 'self' blob:; font-src 'self' data:; base-uri 'self'; form-action 'self' https://github.com">
  <script src="garde.js"></script>
  <title>Administration | Éditions Chant d’orties</title>
  <link rel="icon" href="data:,">
  <!-- Chemins relatifs, jamais « /admin/… » : cette page est servie sous /admin/ chez
       Free et en local, et à la racine du sous-domaine d’administration chez OVH. -->
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <noscript>JavaScript est nécessaire pour accéder à l’administration.</noscript>
  <!-- Decap est embarqué plutôt que chargé depuis un CDN : l’administration détient un
       jeton d’écriture sur le dépôt, elle ne doit dépendre d’aucun tiers à l’exécution.
       Mise à jour : remplacer le fichier de vendor/ et cette ligne. -->
  <script src="vendor/decap-cms-3.15.1.js"></script>
  <script src="preview.js"></script>
</body>
</html>
