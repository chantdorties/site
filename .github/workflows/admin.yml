name: Publish the auth relay

# L'interface d'administration est publiée chez Free avec le site (site.yml). Seul son
# relais de connexion GitHub vit chez OVH, sur son propre sous-domaine : PHP chez Free
# ne peut joindre aucun serveur extérieur. Ce workflow ne se déclenche que si le relais
# a réellement changé.

on:
  push:
    branches: [main]
    paths:
      - 'nouveau-site/frontend/admin-serveur/**'
      - '.github/workflows/admin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chantdorties-admin
  cancel-in-progress: true

jobs:
  administration:
    runs-on: ubuntu-latest
    # Les identifiants FTP du compte OVH sont rangés dans cet environnement ; ils
    # servent aussi bien à l'aperçu qu'au relais, seul le chemin diffère.
    environment: Apercu
    defaults:
      run:
        working-directory: nouveau-site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Le dossier publié ne contient que le relais ; le fichier de secrets, lui, reste
      # sur le serveur, hors de ce dossier. Le .js du relais compte autant que ses .php :
      # la politique de sécurité interdit les scripts inline, la fenêtre de connexion
      # resterait muette sans lui. Le script de publication exige un index.html : une
      # page minimale renvoie vers l'administration chez Free. Les fichiers de l'ancienne
      # interface, inscrits au manifeste distant, sont retirés au premier passage.
      - name: Assemble the published folder
        run: |
          rm -rf .admin-publication
          mkdir -p .admin-publication
          cp frontend/admin-serveur/*.php frontend/admin-serveur/*.js .admin-publication/
          cp frontend/admin-serveur/index.html .admin-publication/
          cp frontend/admin-serveur/htaccess.conf .admin-publication/.htaccess
          ls -a .admin-publication
      - name: Deploy the auth relay to OVH
        env:
          OVH_ADMIN_FTP_HOST: ${{ secrets.OVH_FTP_HOST }}
          OVH_ADMIN_FTP_USER: ${{ secrets.OVH_FTP_USER }}
          OVH_ADMIN_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_ADMIN_FTP_PATH: /orties-admin
        run: python3 tools/deploy-ftp.py --target ovh-admin --dist .admin-publication
      - name: Summary
        run: echo "Relais publié sur https://orties-admin.varascundo.com/" >> "$GITHUB_STEP_SUMMARY"
