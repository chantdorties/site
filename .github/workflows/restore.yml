name: Restore a previous version

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag or branch to restore
        required: true
        type: string

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/nouveau-site
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          path: source
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/nouveau-site/requirements.txt
      - run: sudo apt-get update && sudo apt-get install --yes ghostscript poppler-utils
      - run: python -m pip install --requirement requirements.txt
      - run: make validate
      - uses: actions/upload-artifact@v7
        with:
          name: restored-site-${{ github.run_id }}
          path: source/nouveau-site/dist/
          include-hidden-files: true
          retention-days: 30

  restore:
    needs: rebuild
    runs-on: [self-hosted, linux, free-deploy]
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: automation
      - uses: actions/download-artifact@v8
        with:
          name: restored-site-${{ github.run_id }}
          path: dist/
      - name: Restore on Free
        env:
          FREE_FTP_HOST: ${{ secrets.FREE_FTP_HOST }}
          FREE_FTP_USER: ${{ secrets.FREE_FTP_USER }}
          FREE_FTP_PASSWORD: ${{ secrets.FREE_FTP_PASSWORD }}
          FREE_FTP_PATH: ${{ secrets.FREE_FTP_PATH }}
        run: python3 automation/nouveau-site/tools/deploy-ftp.py --target free --dist dist
