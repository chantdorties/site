name: Test Free FTP reachability

# Workflow temporaire : Free filtrant le FTP selon la provenance géographique, on
# vérifie si un runner GitHub standard est refusé. Si l'authentification passe, le
# runner auto-hébergé décrit dans docs/DEPLOIEMENT.md devient inutile.
#
# La sonde est en lecture seule : connexion, authentification, listage. Elle
# n'envoie ni ne supprime aucun fichier. À supprimer une fois la réponse obtenue.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - name: Where is this runner
        run: curl -s --max-time 15 https://ipinfo.io/json || echo "ipinfo indisponible"
      - name: Try to reach and log into Free over FTP
        env:
          FREE_FTP_USER: ${{ secrets.FREE_FTP_USER }}
          FREE_FTP_PASSWORD: ${{ secrets.FREE_FTP_PASSWORD }}
        run: |
          python3 - <<'FIN'
          import ftplib, os, socket, time
          host = "ftpperso.free.fr"
          print("IP resolue :", socket.gethostbyname(host))
          debut = time.time()
          try:
              ftp = ftplib.FTP(host, timeout=25)
              print(f"banniere ({time.time() - debut:.1f}s) :", ftp.getwelcome())
          except Exception as erreur:
              raise SystemExit(f"connexion KO : {type(erreur).__name__} {str(erreur)[:200]}")

          identifiant = os.environ.get("FREE_FTP_USER")
          motdepasse = os.environ.get("FREE_FTP_PASSWORD")
          if not identifiant or not motdepasse:
              print("Pas d'identifiants : seule la connexion a ete testee.")
              raise SystemExit(0)

          try:
              ftp.login(user=identifiant, passwd=motdepasse)
          except Exception as erreur:
              raise SystemExit(f"AUTHENTIFICATION REFUSEE : {type(erreur).__name__} {str(erreur)[:200]}")
          print("AUTHENTIFICATION ACCEPTEE depuis un runner GitHub")
          ftp.set_pasv(True)
          try:
              entrees = ftp.nlst()
              print(f"listage de la racine : {len(entrees)} entrees")
          except Exception as erreur:
              print("listage KO :", type(erreur).__name__, str(erreur)[:200])
          ftp.quit()
          FIN
