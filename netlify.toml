[build]
  base = "nouveau-site"
  publish = "frontend"
  command = "printf 'Administration statique : aucun build requis.\\n'"
  # Ne reconstruire que si l’administration a changé. Sans cette ligne, chaque
  # contenu enregistré par un rédacteur déclenche un déploiement, alors que le
  # dossier publié est identique — le forfait Netlify s’épuise pour rien.
  # Une sortie nulle annule la construction, d’où l’usage de « git diff --quiet ».
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- frontend ../netlify.toml"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    # Decap interprète sa configuration à l’exécution : sans 'unsafe-eval', l’interface
    # refuse de démarrer sur « Error loading the CMS configuration ». Le CDN unpkg n’est
    # plus autorisé : le script est servi depuis /admin/vendor/.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://api.github.com https://api.netlify.com https://*.netlify.app; frame-src 'self' blob:; worker-src 'self' blob:; font-src 'self' data:; base-uri 'self'; form-action 'self' https://github.com https://api.netlify.com"
